[build-system]
requires = [
    "scikit-build-core>=0.10.1",
    "setuptools-scm>=8.1",
    "nanobind~=2.13.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "mnt.pyfiction"
dynamic = ["version"]
description = "Design Automation for Field-coupled Nanotechnologies"
readme = "README.md"
authors = [
    { name = "Marcel Walter", email = "marcel.walter@tum.de" },
    { name = "Jan Drewniok", email = "jan.drewniok@tum.de" },
    { name = "Simon Hofmann", email = "simon.t.hofmann@tum.de" },
    { name = "Benjamin Hien", email = "benjamin.hien@tum.de" },
    { name = "Willem Lambooy", email = "willem.lambooy@tum.de" }
]
keywords = ["MNT", "fiction", "nanotechnology", "FCN", "QCA", "NML", "SiDB", "design automation", "placement", "routing", "clocking", "simulation"]
license = { file = "LICENSE.txt" }

classifiers = [
    'Development Status :: 4 - Beta',
    'Programming Language :: Python :: 3',
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    'Programming Language :: C++',
    'Environment :: Console',
    'License :: OSI Approved :: MIT License',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: MacOS',
    'Operating System :: POSIX :: Linux',
    'Intended Audience :: Science/Research',
    'Natural Language :: English',
    'Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)',
]

requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.8.0"
]

[project.urls]
Source = 'https://github.com/cda-tum/fiction'
Tracker = 'https://github.com/cda-tum/fiction/issues'
Documentation = 'https://fiction.readthedocs.io/en/latest/'
Research = 'https://www.cda.cit.tum.de/research/fcn/'


[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"
# Set the wheel install directory
wheel.install-dir = "mnt/pyfiction"
# Set required Ninja version
ninja.version = ">=1.10"
# Set default build type to Release
cmake.build-type = "Release"
# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}/{build_type}"
# Explicitly set the package directory
wheel.packages = ["bindings/mnt"]
# Enable Stable ABI builds for CPython 3.12+
wheel.py-api = "cp312"
# Only build the Python bindings target
build.targets = ["pyfiction"]
# Only install the Python package component
install.components = ["fiction_Python"]

metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

# The sdist has to build the extension, so it keeps `include/`, `bindings/`, `vendors/`, and
# `cmake/`. Two rules keep it that way, because `[tool.check-sdist]` below takes this list on
# trust: name directories, never a source glob, and anchor every pattern to the repository root.
# The published sdist shipped no C++ sources at all because `**/include` also matched
# `bindings/mnt/pyfiction/include/` and `**.hpp` matched the library itself.
sdist.exclude = [
    "/.github",
    "/benchmarks",
    "/bib",
    "/cli",
    "/docs",
    "/experiments",
    "/test",
    # the wheel does not ship the Python suite either; `[tool.cibuildwheel] test-sources` copies
    # it in from the source tree
    "/bindings/mnt/pyfiction/test",
    "**/cmake-build-*",
    "**/__pycache__"
]

[tool.scikit-build.cmake.define]
MOCKTURTLE_EXAMPLES = "OFF"
FICTION_PROGRESS_BARS = "OFF"
FICTION_CLI = "OFF"
FICTION_TEST = "OFF"
FICTION_EXPERIMENTS = "OFF"
FICTION_ENABLE_IPO = "OFF"
FICTION_ENABLE_PCH = "OFF"
FICTION_Z3 = "ON"
FICTION_ALGLIB = "ON"
FICTION_PYTHON_BINDINGS = "ON"

[[tool.scikit-build.overrides]]
if.env.READTHEDOCS = "True"
inherit.cmake.define = "append"
cmake.define.FICTION_ENABLE_IPO = "OFF"
cmake.args = [
    "-DCMAKE_VERBOSE_MAKEFILE=ON",
    "-DCMAKE_CXX_FLAGS=-O0",
    "-DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=mold",
    "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=mold",
    "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold"
]

[[tool.scikit-build.overrides]]
if.python-version = ">=3.13"
if.abi-flags = "t"
if.platform-system = "win32"
inherit.cmake.define = "append"
cmake.define.DISABLE_GIL = "1"


[tool.setuptools_scm]


[tool.check-sdist]
# `build-backend` is left at its default `"auto"`, which resolves the scikit-build-core adapter.
# That adapter subtracts `sdist.exclude` from what it expects the sdist to hold, so it takes that
# list on trust rather than checking it -- which is why `sdist.exclude` names directories and never
# a source glob. What this does catch is the other direction: anything in the sdist that git does
# not track, which is what `--inject-junk` exercises.
git-only = [
    "/.github",
    "/benchmarks",
    "/bib",
    "/cli",
    "/docs",
    "/experiments",
    "/test",
    "/bindings/mnt/pyfiction/test",
]


[tool.pytest]
minversion = "9.0"
strict = true
filterwarnings = ["error"]
addopts = [
    "-ra",
    "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
]
log_level = "INFO"
testpaths = ["bindings/mnt/pyfiction/test"]


[tool.cibuildwheel]
build = "cp3*"
archs = "auto64"
skip = ["*-musllinux*"]
build-frontend = "build[uv]"
manylinux-x86_64-image = "manylinux_2_28"
# The wheel does not ship its own tests, so the suite is copied in next to the installed
# wheel. `test-sources` keeps the relative path, and copying `pyproject.toml` along with it
# gives pytest its configuration file, so the wheel runs the same suite under the same
# settings as `nox -s tests` without repeating any of them here.
test-groups = ["test"]
test-sources = ["bindings/mnt/pyfiction/test", "pyproject.toml"]
test-command = "pytest"

[tool.cibuildwheel.linux]
environment = { Z3_ROOT = "/opt/python/cp311-cp311/lib/python3.11/site-packages/z3" }
before-all = "/opt/python/cp311-cp311/bin/pip install z3-solver>=4.8.0"
repair-wheel-command = [
    "export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/opt/python/cp311-cp311/lib/python3.11/site-packages/z3/lib",
    "auditwheel repair -w {dest_dir} {wheel}",
]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }

[tool.cibuildwheel.windows]
before-build = "uv pip install delvewheel>=1.11.2"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --namespace-pkg mnt --ignore-existing"

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }

[[tool.cibuildwheel.overrides]]
# cp312-* wheels carry the abi3 tag (Stable ABI); verify no non-limited-API symbols leaked in
select = "cp312-*"
inherit.repair-wheel-command = "append"
repair-wheel-command = "uvx abi3audit --strict --report {wheel}"


[tool.uv]
required-version = ">=0.5.20"
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
    { file = "bindings/**/*.hpp" },
]

[tool.mypy]
# Every Python file the repository owns, so a new one is checked without anyone remembering to
# add it here. `experiments/` is the exception: `experiments/AGENTS.md` puts those files out of
# reach, so annotating them is not an option
files = ["bindings/mnt/pyfiction", "docs/conf.py", "noxfile.py", "scripts"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/bindings"]
warn_unused_configs = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
strict = true
disallow_untyped_defs = false
explicit_package_bases = true
warn_unreachable = true


[tool.ruff]
line-length = 120
namespace-packages = ["mnt"]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true
src = ["bindings"]


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "single-line-implicit-string-concatenation", # conflicts with the formatter
    "missing-trailing-comma", # conflicts with the formatter
    "PLR09", # too many <...>
    "magic-value-comparison", # a test suite compares against the numbers it expects
    "assert", # a test suite asserts
    "missing-copyright-notice", # the project uses no per-file copyright headers; see #1091
    # `TD002`/`TD003`/`TD004` stay on and demand that a TODO name an author, link an issue, and
    # end in a colon. `FIX002` fires on every TODO regardless of form, so the two cannot both hold
    "line-contains-todo",
]
future-annotations = true

[tool.ruff.lint.isort]
known-first-party = ["mnt.pyfiction"]
# `future-annotations = true` above lets ruff assume PEP 563 semantics when it rewrites an
# annotation, which only holds in files that carry the import. Requiring it closes the gap.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# E501: the expected SVG output is compared verbatim, so its lines cannot be wrapped
"bindings/mnt/pyfiction/test/inout/test_write_svg_layout.py" = ["line-too-long"]
# RUF069: a test that stores a float through a binding and reads it back asserts that it
# comes back unchanged, which is exact; pytest.approx there would hide a broken setter
# PLR6201: a set literal tests membership by hash, a list literal by `__eq__`. The coordinate
# bindings compare equal to the tuples these tests write but do not hash equal to them, so the
# rule's rewrite turns a passing assertion into a failing one
"bindings/mnt/pyfiction/test/**" = ["T20", "ANN", "D", "float-equality-comparison", "literal-membership"]
"docs/**" = ["T20", "A"]
"noxfile.py" = ["T20", "banned-api"]
"scripts/**" = ["T20"]  # maintenance scripts report progress on stdout
"*.pyi" = ["overload-with-docstring", "docstring-in-stub"]  # pydocstyle
# these three run real initialization: the two binding packages register the Windows DLL search
# path before the extension is imported, and the test package does the same before the tests are
# collected. A re-export-only `__init__` cannot do that
"bindings/mnt/__init__.py" = ["non-empty-init-module"]
"bindings/mnt/pyfiction/__init__.py" = ["non-empty-init-module"]
"bindings/mnt/pyfiction/test/__init__.py" = ["non-empty-init-module"]
# standalone scripts run by path, not modules anything imports, so an `__init__.py` would be wrong
".github/scripts/**" = ["implicit-namespace-package"]
"docs/conf.py" = ["implicit-namespace-package"]
# `experiments/AGENTS.md`: these reproduce the results of published papers and are not to be
# modernized, refactored, or reformatted, so the style rules cannot be applied to them
"experiments/**" = [
    "N", # pep8-naming
    "D", # pydocstyle
    "boolean-positional-value-in-call",
    "collapsible-else-if",
    "commented-out-code",
    "implicit-namespace-package",
    "import-private-name",
    "non-augmented-assignment",
    "redefined-loop-name",
    "suspicious-non-cryptographic-random-usage",
]
"*.ipynb" = [
    "D", # pydocstyle
    "module-import-not-at-top-of-file", # Allow imports to appear anywhere in Jupyter notebooks
    "missing-required-import", # Allow missing `from __future__ import annotations` import
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
build = [
    "scikit-build-core>=0.11.0",
    "setuptools-scm>=8.1",
    "nanobind~=2.13.0",
]
docs = [
    "setuptools-scm>=8.1",
    "sphinx==8.1.3; python_version < '3.11'",
    "sphinx==8.2.3; python_version >= '3.11'",
    "breathe==4.36.0",
    "sphinx-rtd-theme==3.1.0",
    "sphinx-tabs==3.5.0",
]
test = [
    "pytest>=9.0.1",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
]
dev = [
    { include-group = "build" },
    { include-group = "test" },
    "nox>=2025.11.12",
]
