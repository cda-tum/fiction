format:
  line_ending: unix
  line_width: 80
  tab_size: 2
  max_hanging_wrap_groups: 2
  dangle_parens: false
  # cmakefmt has no canonical mode. Preserve spellings such as FetchContent_Declare.
  command_case: unchanged
  keyword_case: unchanged
  enable_sort: true
markup:
  first_comment_is_literal: false
  fence_pattern: '^\s*([`~]{3}[`~]*)(.*)$'
  ruler_pattern: '^\s*[^\w\s]{3}.*[^\w\s]{3}$'
