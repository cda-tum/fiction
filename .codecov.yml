codecov:
  require_ci_to_pass: true
comment:
  behavior: default
  layout: reach,diff,flags,files,footer
  require_changes: false
coverage:
  precision: 2
  range: 70..100
  round: down
  status:
    patch:
      default: false
    project:
      default: false
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: cpp
      paths:
        - include/
      statuses:
        - type: project
          target: 95%
          threshold: 0.5%
        - type: patch
          target: 95%
          threshold: 0.5%
    - name: python
      paths:
        - bindings/mnt/pyfiction/**/*.py
      statuses:
        - type: project
          target: auto
          threshold: 0.5%
        - type: patch
          target: 95%
          threshold: 0.5%
parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      macro: false
      method: false
