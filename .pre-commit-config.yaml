# To run all pre-commit checks, use:
#
#     uvx prek run -a
#
# To install pre-commit hooks that run every time you commit:
#
#     uv tool install prek
#     prek install
#

ci:
  autoupdate_commit_msg: "⬆️ Bump pre-commit hooks"
  autofix_commit_msg: "🎨 Incorporated pre-commit fixes"
  autoupdate_schedule: quarterly
  # `mypy` needs `numpy` and `matplotlib` to resolve the imports of the files it
  # checks, which puts its environment over the 250 MiB pre-commit.ci allows a hook. The
  # 🐍 Lint workflow runs it instead
  skip: [mypy]

# The fourth copy of this list. The others are `path_filters:` in `.coderabbit.yaml`, the
# `ignore:` input of cpp-linter-action in `.github/workflows/cpp-linter.yml`, and `exclude`
# in `.license-tools-config.json`, which is JSON and cannot say so itself. Keep them in sync
exclude: "^vendors/|^benchmarks/|bindings/mnt/pyfiction/include/pyfiction/pybind11_mkdoc_docstrings.hpp"

# `prek` runs hooks that share a `priority` concurrently and ascends from there; an unset
# `priority` falls back to file order, which is fully serial. The tiers below are therefore
# a correctness constraint, not a preference:
#
#   0     read-only checks and validators, plus `uv-lock`, which writes only `uv.lock`
#   1-5   the hooks that rewrite every text file, one tier each. `end-of-file-fixer`,
#         `mixed-line-ending`, `trailing-whitespace`, `fix-ligatures`, and `fix-smartquotes`
#         all take `types: [text]`, so any two of them sharing a tier would read-modify-write
#         the same file at the same time and lose one of the two edits
#   6     the language formatters. These share a tier because their file types are disjoint
#   7-9   the hooks that must observe the formatters' result
#
# Do not collapse tiers 1-5 to win back the wall clock; those hooks are cheap, and the
# concurrency that matters is already in tiers 0 and 6. `require_serial` is not a substitute:
# it only prevents concurrent batches of the same hook.
#
# `license-tools` rewrites a file whole, header and body alike, so it cannot share a tier with
# another hook that writes Python, and tiers 1 to 6 and tier 8 all do. It sits at 7 rather
# than 9 so that `ruff-check` at 8 lints the header in the same pass. Its `types_or` is what
# makes it disjoint from `nb-clean`, which also sits at 7 and takes `types: [text]`, so both
# would otherwise receive the same notebooks.

repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        priority: 0
      - id: check-case-conflict
        priority: 0
      - id: check-vcs-permalinks
        priority: 0
      - id: check-merge-conflict
        priority: 0
      - id: check-symlinks
        priority: 0
      - id: check-json
        priority: 0
      - id: check-toml
        priority: 0
      - id: check-yaml
        priority: 0
      - id: debug-statements
        priority: 0
      - id: end-of-file-fixer
        priority: 1
      - id: mixed-line-ending
        priority: 2
      - id: trailing-whitespace
        priority: 3

  # Handle unwanted unicode characters
  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-ligatures
        priority: 4
      - id: fix-smartquotes
        priority: 5

  # Format and lint documentation with MyST support.
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.64
    hooks:
      - id: rumdl
        files: ^docs/.*\.md$
        exclude: (^|/)AGENTS\.md$
        priority: 8
      - id: rumdl-fmt
        files: ^docs/.*\.md$
        exclude: (^|/)AGENTS\.md$
        priority: 6

  # CMake format and lint the CMakeLists.txt files
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: [pyyaml]
        types: [file]
        files: (\.cmake|CMakeLists.txt)(.in)?$
        priority: 6

  # clang-format the C++ part of the code base
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.0
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: ["-style=file"]
        priority: 6

  # Ensure uv lock file is up-to-date
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.7
    hooks:
      - id: uv-lock
        priority: 0

  # Python linting using ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-format
        priority: 6
      - id: ruff-check
        require_serial: true
        # ruff lints `pyproject.toml`, where the rule selectors live, and skips every other TOML
        # file. `uv.lock` is the exception: it carries no extension, so `identify` labels it TOML
        # while ruff falls back to parsing it as Python
        types_or: [python, pyi, jupyter, toml]
        exclude: ^uv\.lock$
        priority: 8

  # Add and update the copyright headers. `types_or` repeats what `include` in
  # `.license-tools-config.json` already says, on purpose: the config scopes a bare `lictool`
  # run, this line scopes the hook. The config carries the second copyright holder as free
  # text in `author.name` after a newline, so the `- present` in it is literal and is never
  # parsed back as a year. That survives a round trip only because `force_author: true`
  # discards the author the tool mis-parses out of the line; turning that off emits a
  # garbage name.
  #
  # On a C++ file the tool emits a `/* ... */` block, and it finds an existing one only with
  # an anchored `re.match` at offset 0. Nothing may therefore precede that block -- a `//`
  # comment above it sends the parse down the `//`-style pattern, which eats the `/*` and
  # leaves a dangling `*/` behind. The Doxygen `@file` block every C++ file carries sits
  # below the copyright block for exactly that reason
  - repo: https://github.com/emzeat/mz-lictools
    rev: v2.9.0
    hooks:
      - id: license-tools
        types_or: [python, pyi, c++]
        priority: 7

  # Check static types with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^(bindings/mnt/pyfiction|docs/.*\.py|experiments|noxfile\.py|scripts)
        args: []
        additional_dependencies:
          - nox
          - pytest
          - sphinx>=8.2.3
          # `experiments/` plots with `matplotlib` and holds its surfaces in `numpy` arrays
          - matplotlib
          - numpy
        priority: 9

  # Format configuration files with prettier
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        exclude: ^docs/.*\.md$
        priority: 6

  # Check JSON schemata
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-codecov
        priority: 0
      - id: check-github-workflows
        priority: 0
      - id: check-readthedocs
        priority: 0
      - id: check-renovate
        additional_dependencies: ["json5"]
        priority: 0

  # Check the pyproject.toml file
  - repo: https://github.com/henryiii/validate-pyproject-schema-store
    rev: 2026.09.04
    hooks:
      - id: validate-pyproject
        priority: 0

  # Clean jupyter notebooks
  - repo: https://github.com/srstevenson/nb-clean
    rev: 4.0.1
    hooks:
      - id: nb-clean
        args:
          - --remove-empty-cells
          - --preserve-cell-metadata
          - raw_mimetype
          - --
        priority: 7
