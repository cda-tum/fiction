name: 🍎 • C++ Tests

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner to execute on
        required: true
        type: string
      compiler:
        description: The C++ compiler binary name
        required: true
        type: string
      preset:
        description: The CMake configure and build preset, `ci-debug` or `ci-release`
        required: true
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-tests-${{
    inputs.runs-on }}-${{ inputs.compiler }}-${{ inputs.preset }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  Z3_VERSION: 4.13.4

jobs:
  build_and_test:
    name: 🍎 ${{ inputs.runs-on }} with ${{ inputs.compiler }} (${{ inputs.preset }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 120
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.x"

      - name: Install building tools
        run: brew install autoconf

      # TBB backs the parallel STL algorithms
      - name: Setup TBB
        run: brew install tbb

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "${{ inputs.runs-on }}-${{ inputs.compiler }}-${{ inputs.preset }}"
          variant: ccache
          save: true
          max-size: 10G

      - name: Setup Z3 Solver
        id: z3
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{ env.Z3_VERSION }}

      - name: Configure CMake
        env:
          COMPILER: ${{ inputs.compiler }}
          PRESET: ${{ inputs.preset }}
          EXTRA_CMAKE_ARGS: >-
            ${{ inputs.preset == 'ci-release' && '-DFICTION_ENABLE_JEMALLOC=ON' || '' }}
        run: >
          cmake -S . --preset "$PRESET"
          -DCMAKE_CXX_COMPILER="$COMPILER"
          $EXTRA_CMAKE_ARGS

      - name: Build
        env:
          PRESET: ${{ inputs.preset }}
        run: cmake --build --preset "$PRESET" --parallel 3

      - name: Test
        env:
          PRESET: ${{ inputs.preset }}
        run: ctest --preset "$PRESET" --output-on-failure --repeat until-pass:3 --parallel 3
