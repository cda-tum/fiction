name: ☂️ • Coverage

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: Token for uploading the report to Codecov
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-coverage
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  Z3_VERSION: 4.13.4
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4

jobs:
  coverage:
    name: ☂️ ubuntu-24.04 g++-13
    runs-on: ubuntu-24.04
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        # a hung apt mirror used to sit here until GitHub's six-hour ceiling killed the job;
        # bound the wait instead, and retry the transient failures that bounding surfaces
        run: |
          timeout 10m sudo -E apt-get update -o Acquire::Retries=3
          timeout 10m sudo -E apt-get install -yq -o Acquire::Retries=3 g++-13 lcov ninja-build

      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "ubuntu-24.04-g++-13-coverage"
          variant: ccache
          # Only `main` writes; pull requests restore its cache. Caches are
          # branch-scoped and the repository shares a 10 GB budget.
          save: ${{ github.ref == 'refs/heads/main' }}
          max-size: 500M

      - name: Setup mold
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - name: Setup Z3 Solver
        id: z3
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{ env.Z3_VERSION }}
          platform: linux
          architecture: x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure CMake
        # the `coverage` preset keeps unity builds off: gcov attributes lines per
        # translation unit, and a unity build would collapse them into one
        run: cmake -S . --preset coverage -DCMAKE_CXX_COMPILER=g++-13

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage --output-on-failure --repeat until-pass:3

      - name: Generate Coverage Report
        run: |
          lcov --gcov-tool gcov-13 -t "fiction-coverage" -o lcov.info -c -d build-coverage/ --ignore-errors mismatch --ignore-errors gcov
          lcov --gcov-tool gcov-13 -e lcov.info "$GITHUB_WORKSPACE/include*" -o lcov_filtered.info
          lcov -l lcov_filtered.info

      - name: Upload report to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov_filtered.info
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
