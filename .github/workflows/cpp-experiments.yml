name: 🧪 • Experiments

# The experiments are 34 stand-alone binaries that reproduce published papers. CI never
# runs them, so building them in every matrix entry bought nothing but build time. One
# job keeps them from rotting.

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-experiments
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  Z3_VERSION: 4.13.4
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build_experiments:
    name: 🧪 Experiments
    runs-on: ubuntu-24.04
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Install libraries and the respective compiler
        env:
          DEBIAN_FRONTEND: noninteractive
        # a hung apt mirror used to sit here until GitHub's six-hour ceiling killed the job;
        # bound the wait instead, and retry the transient failures that bounding surfaces
        run: |
          timeout 10m sudo -E apt-get update -o Acquire::Retries=3
          timeout 10m sudo -E apt-get install -yq -o Acquire::Retries=3 libtbb-dev g++-14

      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "ubuntu-24.04-experiments"
          variant: ccache
          # Only `main` writes; pull requests restore its cache. Caches are
          # branch-scoped and the repository shares a 10 GB budget.
          save: ${{ github.ref == 'refs/heads/main' }}
          max-size: 500M

      - name: Setup mold
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - name: Setup Z3 Solver
        id: z3
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{ env.Z3_VERSION }}
          platform: linux
          architecture: x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure CMake
        run: >
          cmake -S . --preset ci-debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DFICTION_EXPERIMENTS=ON
          -DFICTION_TEST=OFF
          -DFICTION_CLI=OFF

      - name: Build
        run: cmake --build --preset ci-debug
