name: 🐧 • CI

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.hpp"
      - "**/*.cpp"
      - "**/*.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/ubuntu.yml"
      - "!bindings/mnt/pyfiction/include/pyfiction/pybind11_mkdoc_docstrings.hpp"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.hpp"
      - "**/*.cpp"
      - "**/*.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/ubuntu.yml"
      - "!bindings/mnt/pyfiction/include/pyfiction/pybind11_mkdoc_docstrings.hpp"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  Z3_VERSION: 4.13.4

jobs:
  build_and_test:
    permissions:
      contents: read # required to check out the repository

    # Each entry costs a full Debug *and* Release build of a header-only, template-heavy
    # library, so the matrix carries the ends of each compiler family and one point in
    # between, not every version. g++-11 on 22.04 is the oldest combination we support.
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: g++-11
          - os: ubuntu-24.04
            compiler: g++-13
          - os: ubuntu-24.04
            compiler: g++-14
          - os: ubuntu-24.04
            compiler: clang++-18
          - os: ubuntu-24.04
            compiler: clang++-19
          - os: ubuntu-24.04
            compiler: clang++-20
          - os: ubuntu-24.04-arm
            compiler: clang++-19
          - os: ubuntu-24.04-arm
            compiler: clang++-20

    name: 🐧 ${{matrix.os}} with ${{matrix.compiler}}
    runs-on: ${{matrix.os}}
    timeout-minutes: 120

    steps:
      - name: Install libraries and the respective compiler
        env:
          COMPILER: ${{ matrix.compiler }}
        run: sudo apt-get update && sudo apt-get install -yq libtbb-dev "$COMPILER"

      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "${{matrix.os}}-${{matrix.compiler}}"
          variant: ccache
          save: true
          max-size: 10G

      - name: Setup mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Setup Z3 Solver
        if: matrix.os != 'ubuntu-24.04-arm'
        id: z3
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{env.Z3_VERSION}}
          platform: linux
          architecture: x64
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # Build and test pipeline for Debug mode

      - name: Configure CMake (Debug)
        env:
          COMPILER: ${{ matrix.compiler }}
          EXTRA_CMAKE_ARGS: ${{ matrix.os == 'ubuntu-24.04-arm' && '-DFICTION_Z3=OFF' || '' }}
        run: >
          cmake -S . --preset ci-debug
          -DCMAKE_CXX_COMPILER="$COMPILER"
          $EXTRA_CMAKE_ARGS

      - name: Build (Debug)
        run: cmake --build --preset ci-debug --parallel 4

      - name: Test (Debug)
        run: ctest --preset ci-debug --verbose --repeat until-pass:3 --parallel 4

      # Build and test pipeline for Release mode

      - name: Configure CMake (Release)
        env:
          COMPILER: ${{ matrix.compiler }}
          EXTRA_CMAKE_ARGS: ${{ matrix.os == 'ubuntu-24.04-arm' && '-DFICTION_Z3=OFF' || '' }}
        run: >
          cmake -S . --preset ci-release
          -DCMAKE_CXX_COMPILER="$COMPILER"
          -DFICTION_ENABLE_JEMALLOC=ON
          $EXTRA_CMAKE_ARGS

      - name: Build (Release)
        run: cmake --build --preset ci-release --parallel 4

      - name: Test (Release)
        run: ctest --preset ci-release --verbose --repeat until-pass:3 --parallel 4

  # The experiments are 34 stand-alone binaries that reproduce published papers. CI never
  # runs them, so building them in every matrix entry bought nothing but build time. One
  # job keeps them from rotting.
  build_experiments:
    name: 🐧 experiments
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Install libraries and the respective compiler
        run: sudo apt-get update && sudo apt-get install -yq libtbb-dev g++-14

      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "ubuntu-24.04-experiments"
          variant: ccache
          save: true
          max-size: 10G

      - name: Setup mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Setup Z3 Solver
        id: z3
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{env.Z3_VERSION}}
          platform: linux
          architecture: x64
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Configure CMake
        run: >
          cmake -S . --preset ci-debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DFICTION_EXPERIMENTS=ON
          -DFICTION_TEST=OFF
          -DFICTION_CLI=OFF

      - name: Build
        run: cmake --build --preset ci-debug --parallel 4
