name: CI

# The thin caller. Every real job lives in a callable workflow beside this file; the only
# work done here is deciding what runs and aggregating the outcome into `🚦 Check`.
#
# Deliberately no `on: paths:` filters. A workflow that `paths:` skips never reports a
# status context, so it can never be required by branch protection — which is why
# `docs/readthedocs.org:fiction` used to be the only required check in this repository.
# Filtering moved into `change-detection.yml`, whose flags skip *jobs* while
# `🚦 Check` still concludes.

on:
  push:
    branches: ["main"]
  # deliberately unfiltered: a pull request onto any other base still has to report `🚦 Check`,
  # and a required context that never arrives blocks that pull request forever
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  change-detection:
    name: 🔍 Change
    permissions:
      contents: read # required to check out the repository
    uses: ./.github/workflows/change-detection.yml

  # One job per OS and compiler, each building and testing Debug and Release. The caller job's
  # name is the group its checks appear under, so it stays a short label and deliberately does
  # not mention the matrix — GitHub appends the entry itself, and the called job spells it out:
  # `🐧 Test (ubuntu-24.04, g++-13) / 🐧 ubuntu-24.04 g++-13`.
  cpp-tests-ubuntu:
    name: 🐧 Test
    permissions:
      contents: read # required to check out the repository
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        # Each entry costs a full Debug *and* Release build of a header-only, template-heavy
        # library, so the matrix carries the ends of each compiler family and one point in
        # between, not every version. g++-11 on 22.04 is the oldest combination we support.
        include:
          - runs-on: ubuntu-22.04
            compiler: g++-11
          - runs-on: ubuntu-24.04
            compiler: g++-13
          - runs-on: ubuntu-24.04
            compiler: g++-14
          - runs-on: ubuntu-24.04
            compiler: clang++-18
          - runs-on: ubuntu-24.04
            compiler: clang++-19
          - runs-on: ubuntu-24.04
            compiler: clang++-20
          - runs-on: ubuntu-24.04-arm
            compiler: clang++-19
          - runs-on: ubuntu-24.04-arm
            compiler: clang++-20
    uses: ./.github/workflows/cpp-tests-ubuntu.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}

  cpp-tests-macos:
    name: 🍎 Test
    permissions:
      contents: read # required to check out the repository
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15
            compiler: clang++
    uses: ./.github/workflows/cpp-tests-macos.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      compiler: ${{ matrix.compiler }}

  cpp-tests-windows:
    name: 🪟 Test
    permissions:
      contents: read # required to check out the repository
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2025
            toolset: v143
          - runs-on: windows-2025
            toolset: ClangCL
    uses: ./.github/workflows/cpp-tests-windows.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      toolset: ${{ matrix.toolset }}

  cpp-experiments:
    name: 🧪 Experiments
    permissions:
      contents: read # required to check out the repository
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: ./.github/workflows/cpp-experiments.yml

  cpp-linter:
    name: 🚨 Lint
    permissions:
      contents: read # required to check out the repository
      pull-requests: write # required to post/update the clang-tidy thread comment on the PR
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    uses: ./.github/workflows/cpp-linter.yml

  cpp-coverage:
    name: ☂️ Coverage
    permissions:
      contents: read # required to check out the repository
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: ./.github/workflows/cpp-coverage.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  codeql:
    name: 📝 CodeQL
    permissions:
      actions: read # required by github/codeql-action/init to check the workflow run
      contents: read # required to check out the repository
      security-events: write # required to upload the SARIF results
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-codeql)
    uses: ./.github/workflows/codeql.yml

  python-linter:
    name: 🐍 Lint
    permissions:
      contents: read # required to check out the repository
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: ./.github/workflows/python-linter.yml

  packaging-sdist:
    name: 🐍 Packaging
    permissions:
      contents: read # required to check out the repository
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-packaging)
    uses: ./.github/workflows/packaging-sdist.yml

  # `[tool.cibuildwheel] test-command` runs pytest against every wheel, so these jobs are
  # also what runs the Python test suite
  packaging-wheels:
    name: 🐍 Packaging
    permissions:
      contents: read # required to check out the repository
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-packaging)
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-latest]
    uses: ./.github/workflows/packaging-wheels.yml
    with:
      runs-on: ${{ matrix.runs-on }}

  docker:
    name: 🐳 Docker
    permissions:
      contents: read # required to check out the repository
      packages: write # required to push the image to ghcr.io on release
      attestations: write # required to publish the build provenance attestation on release
      id-token: write # required by actions/attest-build-provenance to mint the attestation
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-docker)
    uses: ./.github/workflows/docker.yml

  zizmor:
    name: 🌈 Zizmor
    permissions:
      contents: read # required to check out the repository
      security-events: write # required to upload results to the code scanning API
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-workflows)
    uses: ./.github/workflows/zizmor.yml

  # This job does nothing and is only used for branch protection. `if: always()` is what
  # makes it usable as a required check: without it a failed dependency would *skip* the
  # guard, and a skipped required context leaves a pull request waiting forever.
  required-checks-pass:
    name: 🚦 Check
    if: always()
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-experiments
      - cpp-linter
      - cpp-coverage
      - codeql
      - python-linter
      - packaging-sdist
      - packaging-wheels
      - docker
      - zizmor
    runs-on: ubuntu-slim
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        # `alls-green` fails on any skip that `allowed-skips` did not predict — a job
        # skipped because an upstream job died still fails the guard. A hand-rolled
        # `contains(needs.*.result, 'failure')` would silently pass on lost coverage.
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-skips: >-
            ${{ !fromJSON(needs.change-detection.outputs.run-cpp-tests)
            && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,cpp-experiments,cpp-coverage,' || '' }}
            ${{ !fromJSON(needs.change-detection.outputs.run-cpp-linter)
            && 'cpp-linter,' || '' }}
            ${{ !fromJSON(needs.change-detection.outputs.run-codeql)
            && 'codeql,' || '' }}
            ${{ !fromJSON(needs.change-detection.outputs.run-python-linter)
            && 'python-linter,' || '' }}
            ${{ !fromJSON(needs.change-detection.outputs.run-packaging)
            && 'packaging-sdist,packaging-wheels,' || '' }}
            ${{ !fromJSON(needs.change-detection.outputs.run-docker)
            && 'docker,' || '' }}
            ${{ !fromJSON(needs.change-detection.outputs.run-workflows)
            && 'zizmor' || '' }}
          jobs: ${{ toJSON(needs) }}
