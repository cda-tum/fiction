name: 🐍 • Coverage

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: Token for uploading the reports to Codecov
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-python-coverage
  cancel-in-progress: true

permissions: {}

jobs:
  coverage:
    name: 📈 Coverage
    runs-on: ubuntu-slim
    permissions:
      contents: read # required to check out the repository
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Python coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-coverage-*
          path: coverage-reports
          merge-multiple: true

      - name: Check all platform reports are present
        # Keep the runner names aligned with the python-tests matrix in ci.yml.
        run: |
          for runner in ubuntu-24.04 ubuntu-24.04-arm macos-15 windows-2025; do
            test -s "coverage-reports/coverage-$runner.xml"
          done

      - name: Upload reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          directory: coverage-reports
          flags: python
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
