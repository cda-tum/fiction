name: 🐧 • C++ Tests

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner to execute on
        required: true
        type: string
      compiler:
        description: The C++ compiler package and binary name, e.g. `g++-13`
        required: true
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-tests-${{
    inputs.runs-on }}-${{ inputs.compiler }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  Z3_VERSION: 4.13.4
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  # Z3 has no ARM build in `cda-tum/setup-z3`
  EXTRA_CMAKE_ARGS: ${{ inputs.runs-on == 'ubuntu-24.04-arm' && '-DFICTION_Z3=OFF' || '' }}

jobs:
  build_and_test:
    name: 🐧 ${{ inputs.runs-on }} ${{ inputs.compiler }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Install libraries and the respective compiler
        env:
          COMPILER: ${{ inputs.compiler }}
          DEBIAN_FRONTEND: noninteractive
        # `inputs.compiler` is the binary name CMake needs. Ubuntu ships the Clang binaries in
        # `clang-NN`; `clang++-NN` is no package at all and only resolved because apt falls back
        # to reading an unmatched name as a regex. `g++-NN` is a real package and needs no
        # translation.
        #
        # a hung apt mirror used to sit here until GitHub's six-hour ceiling killed the job;
        # bound the wait instead, and retry the transient failures that bounding surfaces
        run: |
          timeout 10m sudo -E apt-get update -o Acquire::Retries=3
          timeout 10m sudo -E apt-get install -yq -o Acquire::Retries=3 libtbb-dev "${COMPILER/clang++-/clang-}"

      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "${{ inputs.runs-on }}-${{ inputs.compiler }}"
          variant: ccache
          # Only `main` writes, so a pull request restores main's cache without
          # adding an entry of its own. Every job saving 400-700 MB on every push
          # had the repository sitting at 10.19 GB against GitHub's 10 GB limit,
          # evicting caches faster than they could be reused.
          save: ${{ github.ref == 'refs/heads/main' }}
          max-size: 10G

      - name: Setup mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Setup Z3 Solver
        if: inputs.runs-on != 'ubuntu-24.04-arm'
        id: z3
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{ env.Z3_VERSION }}
          platform: linux
          architecture: x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build and test pipeline for Debug mode

      - name: Configure CMake (Debug)
        env:
          COMPILER: ${{ inputs.compiler }}
        run: >
          cmake -S . --preset ci-debug
          -DCMAKE_CXX_COMPILER="$COMPILER"
          $EXTRA_CMAKE_ARGS

      - name: Build (Debug)
        run: cmake --build --preset ci-debug

      - name: Test (Debug)
        run: ctest --preset ci-debug --output-on-failure --repeat until-pass:3

      # Build and test pipeline for Release mode

      - name: Configure CMake (Release)
        env:
          COMPILER: ${{ inputs.compiler }}
        run: >
          cmake -S . --preset ci-release
          -DCMAKE_CXX_COMPILER="$COMPILER"
          -DFICTION_ENABLE_JEMALLOC=ON
          $EXTRA_CMAKE_ARGS

      - name: Build (Release)
        run: cmake --build --preset ci-release

      - name: Test (Release)
        run: ctest --preset ci-release --output-on-failure --repeat until-pass:3
