name: 🐳 • Docker Image

on:
  workflow_call:
    inputs:
      push:
        description: Whether to push the built image to Docker Hub and ghcr.io
        required: false
        default: false
        type: boolean
    secrets:
      DOCKER_USERNAME:
        description: Docker Hub user the image is published under
        required: false
      DOCKER_PASSWORD:
        description: Docker Hub token
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-docker
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: ${{ inputs.push && 'Build and publish' || 'Build' }} the image
    runs-on: ubuntu-latest
    permissions:
      packages: write # required to push the image to ghcr.io on release
      contents: read # required to check out the repository
      attestations: write # required to publish the build provenance attestation on release
      id-token: write # required by actions/attest-build-provenance to mint the attestation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: inputs.push
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/fiction
            ghcr.io/${{ github.repository }}
          tags: |
            ${{ github.event.release.tag_name || 'dev' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ github.workspace }}
          file: Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels || '' }}

      - name: Push README as DockerHub project description
        if: inputs.push
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/fiction
          short-description: ${{ steps.meta.outputs.labels.description || '' }}
          readme-filepath: ${{ github.workspace }}/README.md

      - name: Generate artifact attestation
        if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ secrets.DOCKER_USERNAME }}/fiction
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
