name: Docstring Generator

on:
  # `main` only. This workflow pushes with the default token, which by design starts no
  # workflow run, so a commit it lands on a pull request head would carry no `🚦 Check` and
  # block the merge behind a context that never arrives.
  push:
    branches: ["main"]
    paths:
      - "**/*.hpp"
      - ".github/workflows/pyfiction-docstring-generator.yml"
      - ".github/scripts/mkdoc_compile_flags.py"
  workflow_dispatch:

concurrency:
  # head_ref is always empty for this workflow's push/workflow_dispatch triggers (it's only set
  # for pull_request events), so fall back to github.ref rather than the always-unique run_id --
  # otherwise concurrent runs on the same branch would never actually be serialized, and could
  # race on the "Commit docstrings" push below
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  Z3_VERSION: 4.13.4
  # pybind11_mkdoc parses with libclang, so the generated docstrings depend on which libclang is
  # loaded. Pin it explicitly: mkdoc_lib.py otherwise globs /usr/lib/llvm-* and takes the highest
  # version the runner image happens to ship, which can change the output with no commit here.
  # LLVM_VERSION and the clang PyPI pin below must move together -- the PyPI package only supplies
  # the cindex bindings, and they have to match the shared library that does the parsing.
  LLVM_VERSION: "18"

jobs:
  get_docstrings:
    name: 🐍 Auto-generate docstrings for pyfiction from C++ code
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to commit and push the generated docstrings
    steps:
      - name: Clone Repository
        # zizmor: ignore[artipacked] persisted credentials are required so the later "Commit
        # docstrings" step (EndBug/add-and-commit) can push; that action doesn't accept a token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.x"
          cache: "pip"

      - name: Install build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          cmake ninja-build libreadline-dev libtbb-dev python3-dev
          "libclang-${LLVM_VERSION}-dev"

      - name: Setup Z3 Solver
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{env.Z3_VERSION}}

      - name: Install pybind11_mkdoc and its libclang bindings
        # nanobind is a configure-time dependency of the pyfiction target; the build is only
        # configured here, never compiled
        run: pip install "pybind11_mkdoc==3.0.0" "clang==${LLVM_VERSION}.1.8" nanobind

      - name: Configure the build
        # The generator needs the same include paths and defines as the real build: the
        # CMake-generated headers, the FetchContent'd dependencies, Z3, and ALGLIB. Configuring
        # the pyfiction preset produces a compile database that carries all of them.
        run: cmake --preset pyfiction

      - name: Run pybind11_mkdoc
        env:
          LIBCLANG_PATH: /usr/lib/llvm-${{env.LLVM_VERSION}}/lib/libclang.so.1
        # Resolve the flags and the header list into variables first. Inline command
        # substitution would swallow a failure of either: the generator would still run, just
        # without include paths or without inputs, and commit a truncated header.
        run: |
          set -euo pipefail
          mkdoc_flags="$(python3 .github/scripts/mkdoc_compile_flags.py build-pyfiction)"
          mkdoc_headers="$(find include/fiction -name "*.hpp" -print)"
          python3 -m pybind11_mkdoc \
            -o bindings/mnt/pyfiction/include/pyfiction/pybind11_mkdoc_docstrings.hpp \
            -std=c++20 \
            "-resource-dir=/usr/lib/llvm-${LLVM_VERSION}/lib/clang/${LLVM_VERSION}" \
            ${mkdoc_flags} \
            ${mkdoc_headers}

      - name: Upload docstrings as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ github.workspace }}/bindings/mnt/pyfiction/include/pyfiction/pybind11_mkdoc_docstrings.hpp
          overwrite: true

      - name: Commit docstrings
        # zizmor: ignore[superfluous-actions] keeping the well-tested action (handles the
        # no-changes-to-commit case, author fallback, etc.) instead of hand-rolled git scripting
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          add: "bindings/mnt/pyfiction/include/pyfiction/pybind11_mkdoc_docstrings.hpp"
          commit: "--signoff"
          message: ":memo: Update pyfiction docstrings"
          author_name: GitHub Actions
          author_email: actions@github.com
