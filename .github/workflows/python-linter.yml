name: 🐍 • Lint

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-python-linter
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  mypy:
    name: 🐍 Type check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # required to check out the repository

    # `mypy` is the one hook `.pre-commit-config.yaml` lists under `ci: skip`. Its environment
    # needs `numpy`, `matplotlib`, and `sphinx` to resolve the imports of the files it checks,
    # which puts it over the 250 MiB pre-commit.ci allows a hook. It runs here instead, so the
    # dependencies it needs cost nothing and `prek run -a` stays complete locally.
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
          enable-cache: false

      - name: Run mypy
        run: uvx prek run mypy --all-files
