name: 📝 • CodeQL

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-codeql
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  Z3_VERSION: 4.14.1
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  analyze:
    name: 📝 Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # required by github/codeql-action/init to check the workflow run
      contents: read # required to check out the repository
      security-events: write # required to upload the SARIF results

    strategy:
      fail-fast: false
      matrix:
        # Declaring the build mode is what keeps the two languages honest about how their
        # database is built. C++ is `manual`: the CMake build between `init` and `analyze`
        # below is what CodeQL traces. Python has no build at all, which is `none`.
        #
        # The C++ leg logs `Cannot build an overlay database because build-mode is set to
        # "manual" instead of "none"` on every pull request. That is expected and not
        # actionable. On a pull request the action tries overlay analysis, which reuses a
        # cached database from the default branch and only re-extracts what changed; it
        # supports `build-mode: none` alone, so any leg that builds gets a full database
        # instead. The action offers no way to decline the attempt, so the warning stays.
        #
        # Do not answer it by moving C++ to `none`. Extracting a header-only, template-heavy
        # library without a build leaves CodeQL guessing at the include paths and defines that
        # `FetchContent` puts under `_deps`, and the analysis is worth more than the minutes.
        # Declaring `none` for Python does silence it there, and opens the overlay path once a
        # base database has been cached from `main`.
        include:
          - language: cpp
            build-mode: manual
          - language: python
            build-mode: none

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install libraries and the respective compiler
        if: matrix.language == 'cpp'
        env:
          DEBIAN_FRONTEND: noninteractive
        # a hung apt mirror used to sit here until GitHub's six-hour ceiling killed the job;
        # bound the wait instead, and retry the transient failures that bounding surfaces
        run: |
          timeout 10m sudo -E apt-get update -o Acquire::Retries=3
          timeout 10m sudo -E apt-get install -yq -o Acquire::Retries=3 libtbb-dev clang-17

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup ccache
        if: matrix.language == 'cpp'
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "codeql-ubuntu-24.04-clang++-17"
          variant: ccache
          # Only `main` writes; pull requests restore its cache. Caches are
          # branch-scoped and the repository shares a 10 GB budget.
          save: ${{ github.ref == 'refs/heads/main' }}
          max-size: 500M

      - name: Setup mold
        if: matrix.language == 'cpp'
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - name: Setup Z3 Solver
        if: matrix.language == 'cpp'
        id: z3
        uses: cda-tum/setup-z3@0401375ea1e34d77ef35bbeb634f6203f3bcde60 # v1.7.3
        with:
          version: ${{ env.Z3_VERSION }}
          platform: linux
          architecture: x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql-config.yml

      - if: matrix.language == 'cpp'
        name: Configure CMake
        run: cmake -S . --preset ci-codeql -DCMAKE_CXX_COMPILER=clang++-17

      - if: matrix.language == 'cpp'
        name: Build fiction
        run: cmake --build --preset ci-codeql

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          upload: false
          output: sarif-results

      - name: Filter SARIF file to exclude library warnings
        uses: advanced-security/filter-sarif@83be8931196fc98d9c506ff10e17763fed75bd1b # main
        with:
          patterns: |
            -**/vendors/**
            -**/docs/**
            -**/experiments/**
            -**/_deps/**
          input: sarif-results/${{ matrix.language }}.sarif
          output: sarif-results/${{ matrix.language }}.sarif

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: sarif-results/${{ matrix.language }}.sarif
