name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    permissions:
      contents: write # required to create/update the draft release
      pull-requests: write # required to label pull requests based on release-drafter.yml rules

    runs-on: ubuntu-slim
    name: Draft Release

    steps:
      - uses: release-drafter/release-drafter@c345907820e0396f6f44bcfd9ac4763325f8feb0 # v7.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
