name: 🪟 • C++ Tests

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner to execute on
        required: true
        type: string
      toolset:
        description: The MSVC toolset, `v143` or `ClangCL`
        required: true
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-tests-${{
    inputs.runs-on }}-${{ inputs.toolset }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh # use pwsh as directory handling does not seem to work with bash

env:
  Z3_VERSION: 4.13.4
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  COMPILER: ${{ inputs.toolset == 'ClangCL' && 'clang-cl' || 'cl' }}
  # ccache refuses to cache a compilation that uses a precompiled header unless told that
  # the PCH's macro definitions and __DATE__/__TIME__ expansions can be ignored. On Unix
  # cmake/Cache.cmake wraps the launcher with this; on Windows it cannot, so it is set here
  # instead — otherwise turning PCH on for the CI presets turns caching off.
  CCACHE_SLOPPINESS: pch_defines,time_macros

jobs:
  build_and_test:
    name: 🪟 ${{ inputs.runs-on }} ${{ inputs.toolset }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.x"

      - name: Set up MSVC development environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "${{ inputs.runs-on }}-${{ inputs.toolset }}"
          variant: ccache
          # Only `main` writes, so a pull request restores main's cache without
          # adding an entry of its own. Every job saving 400-700 MB on every push
          # had the repository sitting at 10.19 GB against GitHub's 10 GB limit,
          # evicting caches faster than they could be reused.
          save: ${{ github.ref == 'refs/heads/main' }}
          max-size: 800M

      - name: Setup Z3 Solver
        id: z3
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{ env.Z3_VERSION }}

      # Build and test pipeline for Debug mode.
      # jemalloc is absent throughout: it cannot be downloaded and linked automatically on
      # Windows, which is why the Linux and macOS Release builds layer it on and this one does not

      - name: Configure CMake (Debug)
        run: >
          cmake -S . --preset ci-debug
          -DCMAKE_CXX_COMPILER="$env:COMPILER"
          -DCMAKE_C_COMPILER="$env:COMPILER"

      - name: Build (Debug)
        run: cmake --build --preset ci-debug

      - name: Test (Debug)
        run: ctest --preset ci-debug --output-on-failure --repeat until-pass:3

      # Build and test pipeline for Release mode

      - name: Configure CMake (Release)
        run: >
          cmake -S . --preset ci-release
          -DCMAKE_CXX_COMPILER="$env:COMPILER"
          -DCMAKE_C_COMPILER="$env:COMPILER"

      - name: Build (Release)
        run: cmake --build --preset ci-release

      - name: Test (Release)
        run: ctest --preset ci-release --output-on-failure --repeat until-pass:3
