name: 🐍 • Python Tests

# Builds the extension and runs the pytest suite. Until now pytest only ran inside
# `cibuildwheel`, so a binding regression surfaced during packaging rather than as a test
# failure, and never at all on a pull request that skipped the wheel build (#1114).
#
# The matrix carries the oldest and newest supported interpreter on each runner family.
# `nox -s tests` covers all five locally; every entry here costs a full extension build.

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner to execute on
        required: true
        type: string
      python-version:
        description: The Python version to build and test against
        required: true
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-python-tests-${{
    inputs.runs-on }}-${{ inputs.python-version }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  Z3_VERSION: 4.13.4

jobs:
  tests:
    name: 🐍 ${{ inputs.runs-on }} with Python ${{ inputs.python-version }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install TBB
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -yq libtbb-dev

      - name: Set up MSVC development environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Setup mold
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      # mirrors the wheel build: the action cannot install into the manylinux container
      - name: Install Z3
        if: runner.os != 'Linux'
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{ env.Z3_VERSION }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "${{ inputs.runs-on }}-pyfiction-${{ inputs.python-version }}"
          variant: ccache
          save: true
          max-size: 10G

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          # only refresh the cache from the default branch, so pull requests read it
          # without every one of them writing a new entry
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Run the test suite
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: uvx nox -s "tests-${PYTHON_VERSION}" --verbose
