name: CodeQL Weekly

# CodeQL runs per change from `ci.yml`. This scheduled sweep exists so that new queries
# shipped by GitHub also reach code that has not been touched since the last scan.

on:
  schedule:
    - cron: "30 5 * * 6"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    name: 📝 CodeQL
    permissions:
      actions: read # required by github/codeql-action/init to check the workflow run
      contents: read # required to check out the repository
      security-events: write # required to upload the SARIF results
    uses: ./.github/workflows/codeql.yml
