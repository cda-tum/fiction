name: 🪟 • C++ Tests

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner to execute on
        required: true
        type: string
      toolset:
        description: The MSVC toolset, `v143` or `ClangCL`
        required: true
        type: string
      preset:
        description: The CMake configure and build preset, `ci-debug` or `ci-release`
        required: true
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-tests-${{
    inputs.runs-on }}-${{ inputs.toolset }}-${{ inputs.preset }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh # use pwsh as directory handling does not seem to work with bash

env:
  Z3_VERSION: 4.13.4
  # ccache refuses to cache a compilation that uses a precompiled header unless told that
  # the PCH's macro definitions and __DATE__/__TIME__ expansions can be ignored. On Unix
  # cmake/Cache.cmake wraps the launcher with this; on Windows it cannot, so it is set here
  # instead — otherwise turning PCH on for the CI presets turns caching off.
  CCACHE_SLOPPINESS: pch_defines,time_macros

jobs:
  build_and_test:
    name: 🪟 ${{ inputs.runs-on }} with ${{ inputs.toolset }} toolset (${{ inputs.preset }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 120
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.x"

      - name: Set up MSVC development environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: "${{ inputs.runs-on }}-${{ inputs.toolset }}-${{ inputs.preset }}"
          variant: ccache
          save: true
          max-size: 10G

      - name: Setup Z3 Solver
        id: z3
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{ env.Z3_VERSION }}

      - name: Configure CMake
        env:
          COMPILER: ${{ inputs.toolset == 'ClangCL' && 'clang-cl' || 'cl' }}
          PRESET: ${{ inputs.preset }}
        # no jemalloc here: it cannot be downloaded and linked automatically on Windows,
        # which is why the Linux and macOS workflows layer it on and this one does not
        run: >
          cmake -S . --preset "$env:PRESET"
          -DCMAKE_CXX_COMPILER="$env:COMPILER"
          -DCMAKE_C_COMPILER="$env:COMPILER"

      - name: Build
        env:
          PRESET: ${{ inputs.preset }}
        run: cmake --build --preset "$env:PRESET" --parallel 4

      - name: Test
        env:
          PRESET: ${{ inputs.preset }}
        run: ctest --preset "$env:PRESET" --output-on-failure --repeat until-pass:3 --parallel 4
