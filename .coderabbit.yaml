# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false

  # Keep in sync with `exclude:` in .pre-commit-config.yaml and the `ignore:` input of
  # cpp-linter-action in .github/workflows/cpp-linter.yml
  path_filters:
    - "!vendors/**"
    - "!benchmarks/**"
    - "!docs/_build/**"
    - "!bindings/mnt/pyfiction/include/pyfiction/pybind11_mkdoc_docstrings.hpp"

  path_instructions:
    - path: "**/*.{hpp,cpp}"
      instructions: >-
        Every file opens with the MIT copyright block, then a Doxygen block carrying
        @file, a one-line @brief, and one @author line per contributor as
        `Full Name (handle)`, oldest first. The copyright block is written by the
        license-tools hook; never comment on its contents or suggest editing it, and note
        that nothing may be placed above it. Flag a file this pull request edits whose
        @author list does not name the pull request's author, and flag a new file missing
        either block or carrying an include guard instead of `#pragma once`. See
        "File headers" in AGENTS.md.
    - path: "include/fiction/**"
      instructions: >-
        Header-only C++20. Identifier naming, casing, and formatting are enforced by
        .clang-tidy and .clang-format, and the 🚨 Lint check already reports
        them on every pull request; do not comment on them. Do review contracts, template
        constraints, compile-time cost, and Doxygen coverage: every public symbol needs a
        Doxygen block.
    - path: "bindings/mnt/pyfiction/**"
      instructions: >-
        Python bindings built with nanobind, not pybind11. One translation unit per
        binding, wired into the enclosing register_<name>.cpp. Sources are collected by
        file(GLOB_RECURSE ...); do not suggest adding them to a manual CMake list. Do not
        suggest new Python-level submodules; the mnt.pyfiction namespace shape is fixed.
    - path: "test/**"
      instructions: >-
        Catch2. Test file base names must be unique across the whole test tree because
        CMake derives target names from them. Flag tests that assert on iteration order or
        tie-breaking that the documentation does not promise. Do not suggest merging or
        parameterizing existing test cases.
    - path: "experiments/**"
      instructions: >-
        Reproduction code for published papers. Do not suggest refactors, modernization,
        generalization, naming changes, or performance improvements. Report only
        correctness problems and compilation breakage.
    - path: "docs/changelog.rst"
      instructions: >-
        Entries are one or two sentences, target 90 characters and at most 350, grouped
        under a category bullet with the entries as nested sub-bullets. Flag entries that
        exceed this: per-file enumerations of a refactor, approaches that were tried and
        reverted, lists of individual linter findings, and narration of the order in which
        work happened all belong in the pull request or a code comment, not here.
    - path: "docs/**"
      instructions: >-
        reStructuredText built by Sphinx, with Doxygen directives for the C++ API. A new
        page needs a matching entry in a toctree in docs/index.rst.

  tools:
    # The 🚨 Lint check already reports C++ static-analysis findings on every
    # pull request; a second C++ reviewer duplicates threads without adding signal.
    cppcheck:
      enabled: false

chat:
  auto_reply: true
